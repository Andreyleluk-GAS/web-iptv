<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Web IPTV — an installable HLS stream player with playlist support.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IPTV">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Web IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── Base ───────────────────────────────────────────────────── */
    html {
      /* Use dynamic viewport height so mobile browser chrome is excluded */
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      background-color: #0c0e14;
      color: #e2e8f0;
      /* dvh keeps layout within the visible area on mobile (no scroll behind browser chrome) */
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(0.75rem, 2vw, 1.5rem);
      /* Prevent iOS momentum scroll from causing layout shifts */
      overflow-x: hidden;
    }

    /* ── App shell ──────────────────────────────────────────────── */
    .app-container {
      width: 100%;
      max-width: 1400px;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
      flex: 1;
    }

    /* ── Header bar ─────────────────────────────────────────────── */
    .header-bar {
      display: flex;
      gap: 0.625rem;
      width: 100%;
      align-items: stretch;
    }

    /* ── Inputs ─────────────────────────────────────────────────── */
    input[type="url"],
    input[type="text"] {
      flex: 1;
      min-height: 48px;          /* touch target */
      padding: 0 1rem;
      background: #161a23;
      border: 1px solid #282f3e;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="url"]:focus,
    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    /* ── Buttons ─────────────────────────────────────────────────── */
    button {
      min-height: 48px;          /* touch target */
      padding: 0 1.5rem;
      background-color: #3b82f6;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #2563eb;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── Status banner ───────────────────────────────────────────── */
    .status-banner {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      word-break: break-word;
    }
    .status-banner.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .status-banner.info {
      background-color: rgba(59, 130, 246, 0.15);
      border: 1px solid #3b82f6;
      color: #93c5fd;
    }

    /* ── Main grid ───────────────────────────────────────────────── */
    /*
     * Portrait / narrow  → single column (video on top, channels below)
     * Landscape / wide   → two columns  (video left, channels right)
     * Breakpoint: 700px wide AND landscape orientation.
     * This also catches Android Auto wide-format displays.
     */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      gap: 0.875rem;
      /* Let the grid fill the remaining vertical space so the channel
         panel can stretch to fill it without a fixed magic number. */
      flex: 1;
      min-height: 0;
    }

    /* Wide landscape: side-by-side */
    @media (min-width: 700px) and (orientation: landscape),
           (min-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr 300px;
        grid-template-rows: 1fr;
        align-items: start;
      }
    }
    @media (min-width: 1100px) {
      .main-grid {
        grid-template-columns: 1fr 340px;
      }
    }

    /* ── Video section ───────────────────────────────────────────── */
    .video-section {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      min-width: 0;              /* prevent grid blowout */
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #1f2533;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;       /* letterbox without cropping */
    }
    .now-playing {
      padding: 0.625rem 1rem;
      background: #161a23;
      border: 1px solid #282f3e;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-playing span {
      color: #f1f5f9;
      font-weight: 600;
    }

    /* ── Channels panel ──────────────────────────────────────────── */
    .channels-panel {
      background: #161a23;
      border: 1px solid #282f3e;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      /* Portrait: fixed comfortable height */
      height: 40vh;
      min-height: 220px;
      max-height: 420px;
      overflow: hidden;
    }
    /* Landscape / side-by-side: fill the full column height */
    @media (min-width: 700px) and (orientation: landscape),
           (min-width: 900px) {
      .channels-panel {
        height: auto;
        max-height: none;
        /* Align with the video section height via align-items: start on grid */
        align-self: stretch;
      }
    }

    /* ── Panel header ────────────────────────────────────────────── */
    .panel-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #282f3e;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .panel-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
    }
    .channel-count {
      font-size: 0.75rem;
      background: #282f3e;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      color: #94a3b8;
    }
    /* Search inside panel — full touch target */
    .channel-search {
      width: 100%;
      min-height: 44px;
      padding: 0 0.75rem;
      font-size: 0.9rem;
    }

    /* ── Channel list ────────────────────────────────────────────── */
    .channel-list {
      list-style: none;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
      padding: 0.375rem;
      /* Momentum scrolling on iOS */
      -webkit-overflow-scrolling: touch;
    }
    .channel-list::-webkit-scrollbar {
      width: 5px;
    }
    .channel-list::-webkit-scrollbar-thumb {
      background: #282f3e;
      border-radius: 3px;
    }

    /* ── Channel item ────────────────────────────────────────────── */
    .channel-item {
      min-height: 48px;          /* touch target */
      padding: 0 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.875rem;
      color: #cbd5e1;
      transition: background-color 0.15s, color 0.15s;
      border: 1px solid transparent;
      -webkit-tap-highlight-color: transparent;
      /* Prevent text selection on rapid taps */
      user-select: none;
    }
    .channel-item:hover {
      background: #1f2533;
      color: #fff;
    }
    .channel-item.active {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #60a5fa;
      font-weight: 600;
    }

    /* ── Channel icon ────────────────────────────────────────────── */
    .channel-icon {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      background: #282f3e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .channel-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .channel-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* ── Empty state ─────────────────────────────────────────────── */
    .empty-state {
      padding: 2rem 1rem;
      text-align: center;
      color: #64748b;
      font-size: 0.875rem;
    }

    /* ── Category groups (<details> / <summary>) ─────────────────── */
    .category-group {
      margin-bottom: 2px;
    }
    .category-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      padding: 0 0.75rem;
      background: #1a2030;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #64748b;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      list-style: none;          /* hide default triangle in Firefox */
      transition: background 0.15s, color 0.15s;
      /* Custom arrow via ::after */
      gap: 0.5rem;
    }
    /* Hide default marker in all browsers */
    .category-summary::-webkit-details-marker { display: none; }
    .category-summary::marker { display: none; }
    .category-summary:hover {
      background: #1f2a3a;
      color: #94a3b8;
    }
    .category-group[open] > .category-summary {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.08);
      border-radius: 6px 6px 0 0;
    }
    /* Animated chevron */
    .category-summary .chevron {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      transition: transform 0.2s;
      opacity: 0.5;
    }
    .category-group[open] > .category-summary .chevron {
      transform: rotate(90deg);
      opacity: 1;
    }
    .category-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .category-count {
      font-size: 0.7rem;
      font-weight: 600;
      background: #282f3e;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      color: #64748b;
      flex-shrink: 0;
    }
    .category-group[open] > .category-summary .category-count {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
    }
    /* Channel items inside an open group */
    .category-channels {
      list-style: none;
      background: rgba(0,0,0,0.15);
      border-radius: 0 0 6px 6px;
      padding: 0.25rem 0.25rem 0.25rem 0.5rem;
      border-left: 2px solid rgba(59,130,246,0.15);
      margin-bottom: 2px;
    }

    /* ── Mode selector ───────────────────────────────────────────── */
    .mode-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
    }
    .mode-selector label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 48px;          /* touch target */
      font-size: 0.9rem;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
    }
    .mode-selector label:hover {
      color: #e2e8f0;
    }
    .mode-selector input[type="radio"] {
      accent-color: #3b82f6;
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex: none;
    }
    .mode-selector input[type="radio"]:checked + span {
      color: #60a5fa;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-bar">
      <input 
        type="url" 
        id="playlistUrl" 
        placeholder="Enter .m3u or .m3u8 playlist URL..." 
        value="https://iptv-org.github.io/iptv/languages/eng.m3u"
      >
      <button id="loadBtn">Load</button>
    </div>
    <div class="mode-selector">
      <label>
        <input type="radio" name="urlMode" id="modePlaylist" value="playlist" checked>
        <span>Parse as Playlist</span>
      </label>
      <label>
        <input type="radio" name="urlMode" id="modeDirect" value="direct">
        <span>Play Direct Stream</span>
      </label>
    </div>

    <div id="statusBanner" class="status-banner"></div>

    <div class="main-grid">
      <div class="video-section">
        <div class="video-wrapper">
          <video id="videoPlayer" controls playsinline></video>
        </div>
        <div class="now-playing">
          Now Playing: <span id="currentChannelName">None selected</span>
        </div>
      </div>

      <div class="channels-panel">
        <div class="panel-header">
          <div class="panel-title-row">
            <span class="panel-title">Channels</span>
            <span id="channelCount" class="channel-count">0</span>
          </div>
          <input 
            type="text" 
            id="searchInput" 
            class="channel-search" 
            placeholder="Search channels..."
          >
        </div>
        <ul id="channelList" class="channel-list">
          <li class="empty-state">No playlist loaded. Paste an .m3u link above and click Load.</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    // Ordered list of CORS proxies tried in sequence.
    // codetabs is primary — handles Mixed Content (HTTP→HTTPS) reliably.
    // corsproxy.io is the secondary fallback.
    // Each entry: { build: (url) => proxyUrl, label: string }
    const CORS_PROXIES = [
      {
        label: 'codetabs',
        build: (url) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)
      },
      {
        label: 'corsproxy.io',
        build: (url) => 'https://corsproxy.io/?' + encodeURIComponent(url)
      }
    ];

    const FETCH_TIMEOUT_MS = 10000; // 10 s per attempt

    /**
     * fetch() with an AbortController timeout.
     * Throws on HTTP error, timeout, or network failure.
     */
    async function fetchWithTimeout(url, timeoutMs = FETCH_TIMEOUT_MS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        return res;
      } catch (err) {
        if (err.name === 'AbortError') throw new Error(`Request timed out after ${timeoutMs / 1000}s`);
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    const playlistInput = document.getElementById('playlistUrl');
    const loadBtn = document.getElementById('loadBtn');
    const searchInput = document.getElementById('searchInput');
    const channelListEl = document.getElementById('channelList');
    const channelCountEl = document.getElementById('channelCount');
    const currentChannelEl = document.getElementById('currentChannelName');
    const statusBanner = document.getElementById('statusBanner');
    const video = document.getElementById('videoPlayer');
    const modePlaylist = document.getElementById('modePlaylist');
    const modeDirect = document.getElementById('modeDirect');

    function getMode() {
      return modeDirect.checked ? 'direct' : 'playlist';
    }

    let hls = null;
    let channels = [];
    let activeChannelUrl = null;

    function showStatus(message, type = 'error') {
      statusBanner.textContent = message;
      statusBanner.className = `status-banner ${type}`;
      statusBanner.style.display = 'block';
    }

    function clearStatus() {
      statusBanner.textContent = '';
      statusBanner.style.display = 'none';
    }

    function parseM3U(content) {
      const lines = content.split(/\r?\n/);
      // grouped: Map<categoryName, channel[]>
      const grouped = new Map();
      let currentName = '';
      let currentLogo = '';
      let currentGroup = 'Uncategorized';
      let pendingGroup = null; // set by #EXTGRP line

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTGRP:')) {
          // #EXTGRP is a standalone line that applies to the next entry
          pendingGroup = line.slice(8).trim() || 'Uncategorized';

        } else if (line.startsWith('#EXTINF:')) {
          const commaIdx = line.lastIndexOf(',');
          currentName = commaIdx !== -1
            ? line.substring(commaIdx + 1).trim()
            : `Channel ${grouped.size + 1}`;

          const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
          currentLogo = logoMatch ? logoMatch[1] : '';

          const groupMatch = line.match(/group-title="([^"]*)"/i);
          // group-title attribute wins; fallback to pending #EXTGRP; then 'Uncategorized'
          currentGroup = (groupMatch ? groupMatch[1].trim() : null)
            || pendingGroup
            || 'Uncategorized';
          pendingGroup = null;

        } else if (!line.startsWith('#')) {
          if (line.startsWith('http://') || line.startsWith('https://')) {
            const group = currentGroup || 'Uncategorized';
            if (!grouped.has(group)) grouped.set(group, []);
            grouped.get(group).push({
              name: currentName || `Channel ${Array.from(grouped.values()).flat().length + 1}`,
              url: line,
              logo: currentLogo,
              group
            });
          }
          currentName = '';
          currentLogo = '';
          currentGroup = 'Uncategorized';
          pendingGroup = null;
        }
      }
      return grouped;
    }

    /**
     * Build a single <li class="channel-item"> DOM node.
     */
    function buildChannelItem(channel) {
      const li = document.createElement('li');
      li.className = `channel-item${channel.url === activeChannelUrl ? ' active' : ''}`;

      const iconDiv = document.createElement('div');
      iconDiv.className = 'channel-icon';
      if (channel.logo) {
        const img = document.createElement('img');
        img.src = channel.logo;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = () => { iconDiv.textContent = '📺'; };
        iconDiv.appendChild(img);
      } else {
        iconDiv.textContent = '📺';
      }

      const nameSpan = document.createElement('span');
      nameSpan.className = 'channel-name';
      nameSpan.textContent = channel.name;

      li.appendChild(iconDiv);
      li.appendChild(nameSpan);
      li.addEventListener('click', () => {
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        li.classList.add('active');
        playChannel(channel);
      });
      return li;
    }

    /**
     * Render channels grouped by category using <details>/<summary>.
     * @param {Map<string, object[]>|object[]} source
     *   Pass the full grouped Map for normal render,
     *   or a flat array (search results) to render as a single flat list.
     */
    function renderChannels(source) {
      channelListEl.innerHTML = '';

      // Flatten to count total channels
      const allItems = Array.isArray(source)
        ? source
        : Array.from(source.values()).flat();

      channelCountEl.textContent = allItems.length;

      if (allItems.length === 0) {
        channelListEl.innerHTML = '<li class="empty-state">No matching channels found.</li>';
        return;
      }

      const fragment = document.createDocumentFragment();

      if (Array.isArray(source)) {
        // Flat list (search results) — no category grouping
        source.forEach(ch => fragment.appendChild(buildChannelItem(ch)));
        channelListEl.appendChild(fragment);
        return;
      }

      // Grouped render
      source.forEach((items, groupName) => {
        const details = document.createElement('details');
        details.className = 'category-group';
        // Auto-open the first group
        if (fragment.childElementCount === 0) details.open = true;

        const summary = document.createElement('summary');
        summary.className = 'category-summary';

        // Chevron SVG
        const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        chevron.setAttribute('viewBox', '0 0 24 24');
        chevron.setAttribute('fill', 'none');
        chevron.setAttribute('stroke', 'currentColor');
        chevron.setAttribute('stroke-width', '2.5');
        chevron.setAttribute('stroke-linecap', 'round');
        chevron.setAttribute('stroke-linejoin', 'round');
        chevron.classList.add('chevron');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M9 18l6-6-6-6');
        chevron.appendChild(path);

        const labelSpan = document.createElement('span');
        labelSpan.className = 'category-label';
        labelSpan.textContent = groupName;

        const countBadge = document.createElement('span');
        countBadge.className = 'category-count';
        countBadge.textContent = items.length;

        summary.appendChild(chevron);
        summary.appendChild(labelSpan);
        summary.appendChild(countBadge);
        details.appendChild(summary);

        const ul = document.createElement('ul');
        ul.className = 'category-channels';
        items.forEach(ch => ul.appendChild(buildChannelItem(ch)));
        details.appendChild(ul);

        fragment.appendChild(details);
      });

      channelListEl.appendChild(fragment);
    }

    function playChannel(channel) {
      clearStatus();
      activeChannelUrl = channel.url;
      currentChannelEl.textContent = channel.name;

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });

        hls.loadSource(channel.url);
        hls.attachMedia(video);

        // Clear any error UI as soon as the manifest loads successfully
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          clearStatus();
          video.play().catch(err => console.warn('Autoplay prevented:', err));
        });

        // Track recovery attempts to avoid infinite retry loops
        let mediaRecoveryAttempted = false;
        let networkRetryAttempted = false;

        hls.on(Hls.Events.ERROR, (event, data) => {
          // Non-fatal: hls.js handles these internally, nothing to do
          if (!data.fatal) return;

          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              if (!networkRetryAttempted) {
                networkRetryAttempted = true;
                console.warn('[hls] Fatal network error — attempting startLoad() recovery:', data.details);
                hls.startLoad();
              } else {
                // Second consecutive fatal network error — give up
                showStatus(`Network error: Stream unreachable (${data.details}). Check the URL or try another channel.`, 'error');
                hls.destroy();
                hls = null;
              }
              break;

            case Hls.ErrorTypes.MEDIA_ERROR:
              if (!mediaRecoveryAttempted) {
                mediaRecoveryAttempted = true;
                console.warn('[hls] Fatal media error — attempting recoverMediaError():', data.details);
                hls.recoverMediaError();
              } else {
                // recoverMediaError() already tried once, give up
                showStatus(`Media error: Unable to decode stream (${data.details}). The stream may be unsupported.`, 'error');
                hls.destroy();
                hls = null;
              }
              break;

            default:
              showStatus(`Fatal stream error: ${data.details || 'Unknown error'}`, 'error');
              hls.destroy();
              hls = null;
              break;
          }
        });

        // Reset recovery flags when a new media segment loads cleanly
        hls.on(Hls.Events.FRAG_LOADED, () => {
          mediaRecoveryAttempted = false;
          networkRetryAttempted = false;
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari native HLS fallback
        video.src = channel.url;
        video.addEventListener('loadedmetadata', () => {
          clearStatus();
          video.play().catch(err => console.warn('Autoplay prevented:', err));
        }, { once: true });

        video.onerror = () => {
          showStatus('Playback error: Native video failed to load stream.', 'error');
        };
      } else {
        showStatus('HLS playback is not supported in this browser.', 'error');
      }
    }


    async function loadPlaylist() {
      const url = playlistInput.value.trim();
      if (!url) {
        showStatus('Please enter a URL.', 'error');
        return;
      }

      clearStatus();
      loadBtn.disabled = true;
      loadBtn.textContent = 'Loading...';

      // --- Direct stream mode: bypass all fetching ---
      if (getMode() === 'direct') {
        channels = [];
        renderChannels([]);
        playChannel({ name: 'Direct Stream', url: url, logo: '' });
        loadBtn.disabled = false;
        loadBtn.textContent = 'Load';
        return;
      }

      // --- Playlist mode: try direct fetch first, then each CORS proxy ---
      showStatus('Fetching playlist...', 'info');

      let text = null;
      let lastError = null;

      // Attempt 1: direct fetch (succeeds when server sends CORS headers)
      try {
        const response = await fetchWithTimeout(url);
        text = await response.text();
      } catch (directErr) {
        lastError = directErr;
      }

      // Attempt 2…N: try each proxy in order until one works
      if (text === null) {
        for (const proxy of CORS_PROXIES) {
          showStatus(`Direct fetch failed — retrying via ${proxy.label}...`, 'info');
          try {
            const proxyResponse = await fetchWithTimeout(proxy.build(url));
            text = await proxyResponse.text();
            lastError = null;
            break; // success — stop trying more proxies
          } catch (proxyErr) {
            lastError = proxyErr;
            console.warn(`[proxy:${proxy.label}] failed:`, proxyErr.message);
          }
        }
      }

      // All attempts exhausted — always reset UI to a final error state
      if (text === null) {
        showStatus(
          `Fetch failed: ${lastError ? lastError.message : 'Unknown error'}. ` +
          'Check the URL or try "Play Direct Stream" mode.',
          'error'
        );
        loadBtn.disabled = false;
        loadBtn.textContent = 'Load';
        return;
      }

      try {
        channels = parseM3U(text); // now a Map<group, channel[]>
        const allChannels = Array.from(channels.values()).flat();
        if (allChannels.length === 0) {
          throw new Error('No valid channels found. Is this really a playlist? Try "Play Direct Stream" mode.');
        }
        clearStatus();
        renderChannels(channels);
        playChannel(allChannels[0]);
      } catch (parseErr) {
        showStatus(`Parse error: ${parseErr.message}`, 'error');
      } finally {
        loadBtn.disabled = false;
        loadBtn.textContent = 'Load';
      }
    }

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        // Restore full grouped view when search is cleared
        renderChannels(channels);
        return;
      }
      // Flatten all channels and filter by name
      const allChannels = Array.isArray(channels)
        ? channels
        : Array.from(channels.values()).flat();
      const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
      renderChannels(filtered);
    });

    loadBtn.addEventListener('click', loadPlaylist);
    playlistInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadPlaylist();
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[SW] Registered, scope:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }
  </script>
</body>
</html>
